<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DELTA</title>
  <meta name="theme-color" content="#04030c" />
  <meta name="description" content="DELTA, tu asistente personal" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/logo.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/icono-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/estilos.css" />
</head>
<body>
  <canvas id="estrellas" aria-hidden="true"></canvas>
  <!-- Pantalla de entrada -->
  <section id="entrada" class="entrada" hidden>
    <div class="entrada-caja">
      <div class="marca"><img src="/icons/logo.svg" alt="" /><span class="palabras"><b>DELTA</b><small>MARKETING</small></span></div>
      <p class="lema">Boutique Medical Marketing</p>
      <p>Identifíquese, señor.</p>
      <form id="form-entrada">
        <input id="clave" type="password" placeholder="Clave de acceso" autocomplete="current-password" required />
        <button type="submit">Entrar</button>
      </form>
      <p id="error-entrada" class="error" hidden></p>
    </div>
  </section>

  <main id="app" class="app" hidden>
    <header class="barra">
      <div class="marca"><img src="/icons/logo.svg" alt="" /><span class="palabras"><b>DELTA</b><small>MARKETING</small></span></div>
      <span class="lema">Boutique Medical Marketing</span>
      <div class="barra-datos">
        <span id="clima" class="dato"></span>
        <span id="reloj" class="dato reloj">--:--</span>
      </div>
      <button id="btn-ajustes" class="icono" aria-label="Ajustes" title="Ajustes"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </header>

    <div class="rejilla">
      <!-- Columna izquierda: hoy y calendario -->
      <section class="panel" id="panel-agenda" data-tab="agenda">
        <h2>Agenda</h2>
        <div id="resumen-hoy" class="resumen"></div>
        <ul id="lista-eventos" class="lista"></ul>
        <h3>Recordatorios</h3>
        <ul id="lista-recordatorios" class="lista"></ul>
      </section>

      <!-- Centro: orbe y conversación -->
      <section class="centro" data-tab="hablar">
        <button id="orbe" class="orbe" aria-label="Tocar para hablar">
          <canvas id="lienzo" width="600" height="600"></canvas>
          <img class="logo-orbe" src="/icons/logo.svg" alt="" />
          <span id="estado-orbe" class="estado-orbe">Toque para hablar</span>
        </button>
        <div id="conversacion" class="conversacion" aria-live="polite"></div>
        <form id="form-chat" class="form-chat">
          <input id="texto" type="text" placeholder="Escríbale a DELTA…" autocomplete="off" />
          <button id="btn-mic" type="button" class="icono mic" aria-label="Hablar" title="Hablar"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
          <button type="submit" class="enviar" aria-label="Enviar">➤</button>
        </form>
      </section>

      <!-- Derecha: tareas y conexiones -->
      <section class="panel" id="panel-tareas" data-tab="tareas">
        <h2>Tareas</h2>
        <form id="form-tarea" class="form-mini">
          <input id="nueva-tarea" type="text" placeholder="Nueva tarea…" />
          <button type="submit">+</button>
        </form>
        <ul id="lista-tareas" class="lista"></ul>
        <h3>Conexiones</h3>
        <ul id="lista-conexiones" class="conexiones"></ul>
        <h3>Avisos recientes</h3>
        <ul id="lista-avisos" class="lista tenue"></ul>
      </section>
    </div>

    <!-- Pestañas para el celular -->
    <nav class="pestanas">
      <button data-ir="agenda">Agenda</button>
      <button data-ir="hablar" class="activa">DELTA</button>
      <button data-ir="tareas">Tareas</button>
    </nav>
  </main>

  <dialog id="ajustes" class="dialogo">
    <form method="dialog">
      <h2>Ajustes</h2>
      <label>Zona horaria <input id="aj-zona" type="text" /></label>
      <label>Hora del resumen diario <input id="aj-resumen" type="time" /></label>
      <label class="fila"><input id="aj-voz" type="checkbox" /> Responder en voz alta</label>
      <label class="fila"><input id="aj-manos" type="checkbox" /> Manos libres (diga "Delta…")</label>
      <div class="botones">
        <button type="button" id="btn-push">Activar avisos en este equipo</button>
        <button type="button" id="btn-prueba">Enviar aviso de prueba</button>
        <button type="button" id="btn-instalar" hidden>Instalar app</button>
      </div>
      <p id="aj-msg" class="tenue"></p>
      <div class="botones"><button value="cerrar" id="aj-guardar" class="primario">Guardar</button></div>
    </form>
  </dialog>

  <script src="/app.js" type="module"></script>
</body>
</html>
