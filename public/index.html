<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DELTA</title>
  <meta name="theme-color" content="#04030c" />
  <meta name="description" content="DELTA, tu asistente personal" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/logo.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/icono-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/estilos.css" />
</head>
<body>
  <canvas id="estrellas" aria-hidden="true"></canvas>
  <!-- Pantalla de entrada -->
  <section id="entrada" class="entrada" hidden>
    <div class="entrada-caja">
      <div class="marca"><img src="/icons/logo.svg" alt="" /><span class="palabras"><b>DELTA</b><small>MARKETING</small></span></div>
      <p class="lema">Boutique Medical Marketing</p>
      <p>Identifíquese, señor.</p>
      <form id="form-entrada">
        <input id="clave" type="password" placeholder="Clave de acceso" autocomplete="current-password" required />
        <button type="submit">Entrar</button>
      </form>
      <p id="error-entrada" class="error" hidden></p>
    </div>
  </section>

  <main id="app" class="app" hidden>
    <header class="barra">
      <div class="marca"><img src="/icons/logo.svg" alt="" /><span class="palabras"><b>DELTA</b><small>MARKETING</small></span></div>
      <span class="lema">Boutique Medical Marketing</span>
      <div class="barra-datos">
        <span id="clima" class="dato"></span>
        <span id="reloj" class="dato reloj">--:--</span>
      </div>
      <button id="btn-ajustes" class="icono" aria-label="Ajustes" title="Ajustes"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </header>

    <div class="rejilla">
      <!-- Columna izquierda: hoy y calendario -->
      <section class="panel" id="panel-agenda" data-tab="agenda">
        <div class="ag-cabeza">
          <h2>Agenda</h2>
          <div class="ag-botones">
            <button id="ag-ampliar" class="ag-ampliar" type="button" title="Ver el calendario en grande">⤢ Ampliar</button>
            <button id="ag-agregar" class="ag-agregar" type="button">+ Agregar</button>
          </div>
        </div>
        <div id="resumen-hoy" class="resumen"></div>
        <div class="ag-control">
          <div class="segmento" role="tablist" aria-label="Vista">
            <button type="button" data-vista="dia" class="activa">Día</button>
            <button type="button" data-vista="semana">Semana</button>
            <button type="button" data-vista="mes">Mes</button>
          </div>
          <div class="navegar">
            <button type="button" id="ag-ant" aria-label="Anterior">‹</button>
            <button type="button" id="ag-hoy">Hoy</button>
            <button type="button" id="ag-sig" aria-label="Siguiente">›</button>
          </div>
        </div>
        <div id="ag-titulo" class="ag-titulo"></div>
        <div id="ag-contenido" class="ag-contenido"></div>
        <p class="ag-leyenda"><span class="ag-tipo evento"></span>Cita <span class="ag-tipo tarea"></span>Tarea <span class="ag-tipo recordatorio"></span>Recordatorio</p>
      </section>

      <!-- Centro: orbe y conversación -->
      <section class="centro" data-tab="hablar">
        <button id="orbe" class="orbe" aria-label="Tocar para hablar">
          <canvas id="lienzo" width="600" height="600"></canvas>
          <img class="logo-orbe" src="/icons/logo.svg" alt="" />
          <span id="estado-orbe" class="estado-orbe">Toque para hablar</span>
        </button>
        <div id="conversacion" class="conversacion" aria-live="polite"></div>
        <div id="adjuntos" class="adjuntos" hidden></div>
        <form id="form-chat" class="form-chat">
          <input id="archivo" type="file" multiple hidden accept="image/*,.pdf,.docx,.xlsx,.csv,.txt,.md,application/pdf,text/csv,text/plain" />
          <button id="btn-clip" type="button" class="icono clip" aria-label="Adjuntar archivo" title="Adjuntar foto o archivo"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5 12.6 19.9a5.5 5.5 0 0 1-7.8-7.8l8.5-8.5a3.7 3.7 0 0 1 5.2 5.2l-8.5 8.5a1.8 1.8 0 0 1-2.6-2.6l7.8-7.8"/></svg></button>
          <input id="texto" type="text" placeholder="Escríbale a DELTA…" autocomplete="off" />
          <button id="btn-mic" type="button" class="icono mic" aria-label="Hablar" title="Hablar"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
          <button type="submit" class="enviar" aria-label="Enviar">➤</button>
        </form>
      </section>

      <!-- Derecha: tareas y conexiones -->
      <section class="panel" id="panel-tareas" data-tab="tareas">
        <h2>Tareas</h2>
        <form id="form-tarea" class="form-mini">
          <input id="nueva-tarea" type="text" placeholder="Nueva tarea…" />
          <button type="submit">+</button>
        </form>
        <ul id="lista-tareas" class="lista"></ul>
        <h3>Mercados</h3>
        <ul id="lista-mercados" class="lista mercados"></ul>
        <h3>Conexiones</h3>
        <ul id="lista-conexiones" class="conexiones"></ul>
        <h3>Avisos recientes</h3>
        <ul id="lista-avisos" class="lista tenue"></ul>
      </section>
    </div>

    <!-- Pestañas para el celular -->
    <nav class="pestanas">
      <button data-ir="agenda">Agenda</button>
      <button data-ir="hablar" class="activa">DELTA</button>
      <button data-ir="tareas">Tareas</button>
    </nav>
  </main>

  <dialog id="agregar" class="dialogo">
    <form id="form-agregar" method="dialog">
      <h2>Agregar</h2>
      <div class="segmento ancho" role="radiogroup" aria-label="Tipo">
        <button type="button" data-tipo="cita" class="activa">Cita</button>
        <button type="button" data-tipo="tarea">Tarea</button>
        <button type="button" data-tipo="recordatorio">Recordatorio</button>
      </div>
      <label>Qué es <input id="ag-f-titulo" type="text" required maxlength="200" placeholder="Ej. Junta con Café Luna" /></label>
      <div class="fila-2">
        <label>Día <input id="ag-f-dia" type="date" required /></label>
        <label>Hora <input id="ag-f-hora" type="time" value="09:00" /></label>
      </div>
      <label data-solo="cita">Lugar <input id="ag-f-lugar" type="text" maxlength="200" placeholder="Opcional" /></label>
      <label data-solo="recordatorio">Repetir
        <select id="ag-f-repetir"><option value="no">No</option><option value="diario">Cada día</option><option value="semanal">Cada semana</option><option value="mensual">Cada mes</option></select>
      </label>
      <p id="ag-f-msg" class="error" hidden></p>
      <div class="botones">
        <button type="button" id="ag-f-cancelar">Cancelar</button>
        <button type="submit" class="primario">Guardar</button>
      </div>
    </form>
  </dialog>

  <dialog id="detalle" class="dialogo">
    <span id="det-tipo" class="det-tipo"></span>
    <h3 id="det-titulo" class="det-titulo"></h3>
    <p id="det-cuando" class="det-cuando"></p>
    <p id="det-lugar" class="det-linea" hidden></p>
    <p id="det-sub" class="det-linea tenue" hidden></p>
    <div id="det-acciones" class="botones"></div>
  </dialog>

  <dialog id="ajustes" class="dialogo">
    <form method="dialog">
      <h2>Ajustes</h2>
      <label>Zona horaria <input id="aj-zona" type="text" /></label>
      <label>Hora del resumen diario <input id="aj-resumen" type="time" /></label>
      <label class="fila"><input id="aj-voz" type="checkbox" /> Responder en voz alta</label>
      <label class="fila"><input id="aj-manos" type="checkbox" /> Manos libres (diga "Delta…")</label>
      <div class="botones">
        <button type="button" id="btn-push">Activar avisos en este equipo</button>
        <button type="button" id="btn-prueba">Enviar aviso de prueba</button>
        <button type="button" id="btn-instalar" hidden>Instalar app</button>
      </div>
      <div class="botones">
        <button type="button" id="btn-gmail">Conectar Gmail</button>
      </div>
      <div class="botones">
        <button type="button" id="btn-nueva-conv">Empezar conversación nueva</button>
        <button type="button" id="btn-salir">Cerrar sesión</button>
        <button type="button" id="btn-salir-todo">Cerrar sesión en todos los equipos</button>
      </div>
      <p id="aj-msg" class="tenue"></p>
      <div class="botones"><button value="cerrar" id="aj-guardar" class="primario">Guardar</button></div>
    </form>
  </dialog>

  <script src="/app.js" type="module"></script>
</body>
</html>
